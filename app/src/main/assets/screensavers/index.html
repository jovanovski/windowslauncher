<!DOCTYPE html>
<!--
    One screen saver on a canvas, for ScreensaverManager to point a WebView at:

        index.html?kind=pipes            full screen, drawn at the screen's own scale
        index.html?kind=pipes&vw=411     the Display Properties monitor, the screen in miniature

    kind is one of the ids in SaverCatalog.kt; vw is the real screen's width in CSS pixels,
    which is what tells a preview how much to shrink everything by.
-->
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>Screen Savers</title>
    <style>
        html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
        canvas { display: block; width: 100%; height: 100%; }
    </style>
</head>
<body>
    <canvas id="screen"></canvas>
    <script>
        var Q = new URLSearchParams(location.search);
        window.SAVER_VW = parseFloat(Q.get('vw')) || 0;
    </script>
    <script src="savers.js"></script>
    <script>
        (function () {
            var preview = window.SAVER_VW > 0;
            if (!preview) window.SAVER_VW = innerWidth;
            Savers.run(document.getElementById('screen'), Q.get('kind') || 'blank', preview, undefined, !preview);
        })();
    </script>
</body>
</html>
